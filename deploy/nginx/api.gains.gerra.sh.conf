# nginx vhost for api.gains.gerra.sh — pushed by `python3 tools/deploy_server.py nginx`
#
# Cert (once, after the DNS A record exists):
#   ssh hetzner_gb 'certbot certonly --nginx -d api.gains.gerra.sh'
# Always `certonly` — never bare `certbot --nginx` (its installer injects duplicate server
# blocks; see fintrack's deploy notes).

server {
    server_name api.gains.gerra.sh;
    # A workout photo is a few hundred kilobytes; the server itself caps a blob at 8 MB.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.gains.gerra.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gains.gerra.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gains.gerra.sh;

    # Redirect scoped to location / so the ACME .well-known include stays reachable
    location / {
        return 301 https://api.gains.gerra.sh$request_uri;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;
}
