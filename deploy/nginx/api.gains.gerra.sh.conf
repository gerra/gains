# nginx vhost for api.gains.gerra.sh — pushed by `python3 tools/deploy_server.py nginx`
#
# Cert (once, after the DNS A record exists):
#   ssh hetzner_gb 'certbot certonly --nginx -d api.gains.gerra.sh'
# Always `certonly` — never bare `certbot --nginx` (its installer injects duplicate server
# blocks; see fintrack's deploy notes).

# Rate limits per client address (docs/launch-plan.md, item 23). nginx terminates TLS, so
# $binary_remote_addr is the real client. The server adds per-account ceilings behind these
# (Services.maxDocumentsPerUser, maxBlobBytesPerUser); docs/sync.md, "The server", has the numbers.
#
# Sign-in, exchange, refresh and deletion: a person needs a few a minute. Every sign-in token is
# checked against Google's or Apple's keys, so an unlimited /auth/ is free work for anyone.
limit_req_zone $binary_remote_addr zone=gains_auth:1m rate=10r/m;
# Sync: a first sync of a long history is a push per 200 documents, a pull per 500 and a request
# per photo, one after another. Past the burst a request is delayed rather than refused (no
# nodelay below), so one device syncing in sequence only slows to the rate; it takes a flood of
# parallel requests to see a 429.
limit_req_zone $binary_remote_addr zone=gains_sync:10m rate=10r/s;
# Photo uploads and downloads in flight at once: the app sends one at a time; a few more leave
# room for several phones behind one address (a gym's wifi).
limit_conn_zone $binary_remote_addr zone=gains_blobs:1m;
# The guest list's zone, gains_guest_list, is declared in gains.gerra.sh.conf; zones are global.

server {
    server_name api.gains.gerra.sh;
    # A workout photo is a few hundred kilobytes; the server itself caps a blob at 8 MB.
    client_max_body_size 10M;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /auth/ {
        limit_req zone=gains_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /sync/ {
        limit_req zone=gains_sync burst=200 delay=100;
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /sync/blobs/ {
        limit_req zone=gains_sync burst=200 delay=100;
        limit_conn gains_blobs 8;
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The site's form posts to gains.gerra.sh/guest-list, limited there; this is the same route
    # reached on the API's name, which would otherwise skip that limit.
    location = /guest-list {
        limit_req zone=gains_guest_list burst=5 nodelay;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.gains.gerra.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gains.gerra.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gains.gerra.sh;

    # Redirect scoped to location / so the ACME .well-known include stays reachable
    location / {
        return 301 https://api.gains.gerra.sh$request_uri;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;
}
