# Catch-all for every hostname the box has no site for — pushed by
# `python3 tools/deploy_server.py nginx`, which installs it as sites-available/default (in
# place of the stock page, which it backs up first).
#
# Without it nginx answers an unknown name with the first site it loads, alphabetically: that
# was api.gains.gerra.sh, so gains.gerra.sh used to redirect to the API and show the API's
# certificate. Here, plain HTTP gets no answer at all (444 closes the connection), and HTTPS
# shows a self-signed certificate for no real name and then closes too.
#
# The certificate is made on the box by `deploy_server.py nginx` (FALLBACK_CERTIFICATE there),
# not by certbot. `ssl_reject_handshake on` would need no certificate at all, but it needs
# nginx 1.19.4 and the box runs 1.18. No other file in sites-enabled may say `default_server`:
# `nginx -t` fails with "a duplicate default server", and `deploy_server.py nginx` then puts
# everything back as it was.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/default.crt;
    ssl_certificate_key /etc/nginx/ssl/default.key;

    return 444;
}
