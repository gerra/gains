# nginx vhost for gains.gerra.sh, the app's static site — pushed by
# `python3 tools/deploy_server.py nginx`; the pages in site/ by `deploy_server.py site`.
#
# Cert (once, after the DNS A record exists):
#   ssh hetzner_gb 'certbot certonly --nginx -d gains.gerra.sh'
# Always `certonly` — never bare `certbot --nginx` (its installer injects duplicate server
# blocks; see fintrack's deploy notes).

# The guest list form: a few tries a minute per address is plenty for a person.
limit_req_zone $binary_remote_addr zone=gains_guest_list:1m rate=6r/m;

server {
    server_name gains.gerra.sh;
    root /var/www/gains.gerra.sh;

    # Clean URLs: /privacy serves privacy.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # The guest list form posts here; the server (deploy/gains-server.service) stores it.
    location = /guest-list {
        limit_req zone=gains_guest_list burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/gains.gerra.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gains.gerra.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name gains.gerra.sh;

    # Redirect scoped to location / so the ACME .well-known include stays reachable
    location / {
        return 301 https://gains.gerra.sh$request_uri;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;
}
