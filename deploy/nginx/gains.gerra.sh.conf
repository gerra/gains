# nginx vhost for gains.gerra.sh, the app's own site (site/) — pushed by
# `python3 tools/deploy_server.py nginx`; the pages themselves by `deploy_server.py site`.
#
# Cert (once, after the DNS A record exists):
#   ssh hetzner_gb 'certbot certonly --nginx -d gains.gerra.sh'
# Always `certonly` — never bare `certbot --nginx` (its installer injects duplicate server
# blocks; see fintrack's deploy notes).

server {
    server_name gains.gerra.sh;
    root /var/www/gains.gerra.sh;
    index index.html;

    # Clean URLs: /privacy serves privacy.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;

    # Images, the stylesheet and icons change rarely; the pages are revalidated every time.
    location ~* \.(?:css|png|webp|ico|svg)$ {
        expires 7d;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/gains.gerra.sh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gains.gerra.sh/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name gains.gerra.sh;

    # Redirect scoped to location / so the ACME .well-known include stays reachable
    location / {
        return 301 https://gains.gerra.sh$request_uri;
    }

    include /opt/ssl-manager/web_server_includes/nginx_well_known_service_template.conf;
}
