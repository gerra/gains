# Kotlin/Native compiles and links the iOS framework inside the Gradle daemon, and the release
# link (whole-program devirtualization) outgrew 3g: TestFlight archives died with
# "OutOfMemoryError: Java heap space" in :composeApp:linkReleaseFrameworkIosArm64. The macOS
# runner has 7 GB, so 5g still leaves room for Xcode and the system.
org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Set to false to configure the build without the Android Gradle Plugin
# (useful on machines without an Android SDK, e.g. CI boxes that only run
# the shared-module tests and the desktop target):  -Pgains.android=false
gains.android=true

# Kotlin/Native: allow klib compilation for Apple targets on non-Apple hosts
kotlin.native.enableKlibsCrossCompilation=true
kotlin.mpp.enableCInteropCommonization=true

# Desktop sign-in (docs/development.md, "Desktop"), passed to the app as system properties. The
# Google Desktop app client comes with a secret that Google documents as not secret for installed
# apps, but it stays out of the repository: set gains.googleDesktopClientSecret with -P or in
# ~/.gradle/gradle.properties. Google's button stays hidden until both the id and the secret are set.
# Apple's goes through the server's web flow and shows once gains.appleServicesId is set: the
# server's APPLE_SERVICES_ID, set here once it is deployed (docs/launch-plan.md, item 10).
gains.serverUrl=https://api.gains.gerra.sh
gains.googleDesktopClientId=
gains.appleServicesId=
