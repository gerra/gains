// Android target of :protocol (applied only when gains.android=true), on the Kotlin Multiplatform
// library plugin: AGP 9 no longer takes com.android.library next to the Kotlin Multiplatform plugin
// (docs/launch-plan.md, item 38). Groovy, so the Kotlin DSL build file never names an AGP type,
// and applied before the kotlin { } block there, which only exists once this creates the target.
kotlin {
    android {
        namespace = "app.gains.protocol"
        compileSdk = libs.versions.android.compileSdk.get().toInteger()
        minSdk = libs.versions.android.minSdk.get().toInteger()
    }
}
