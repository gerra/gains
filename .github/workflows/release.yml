name: Release

# Every two hours through the day, on the odd hours from 09:00 to 23:00 UTC, uploads the
# newest release branch (release/<major>.<minor>, cut by the "Cut release branch" workflow
# an hour earlier) to TestFlight, tags the commit that shipped as
# testflight/<version>/<build>, opens a pull request from the branch to main and publishes
# the tag as the latest GitHub release, which the README's TestFlight badge shows. A branch
# whose tip already carries such a tag is left alone, so a round without a new cut uploads
# nothing. "Run workflow" releases by hand, for a chosen branch or again for one that
# shipped already (a fix pushed to a release branch is picked up either way).
#
# How the pieces fit together: docs/testflight.md#releases-through-the-day
on:
  schedule:
    - cron: "0 9-23/2 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch to upload (release/<major>.<minor>). Defaults to the newest."
        required: false
        type: string
      force:
        description: "Upload even if this commit already went to TestFlight"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pick:
    name: Pick the release branch
    runs-on: ubuntu-latest
    outputs:
      upload: ${{ steps.pick.outputs.upload }}
      branch: ${{ steps.pick.outputs.branch }}
      version: ${{ steps.pick.outputs.version }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          BRANCH: ${{ inputs.branch }}
          FORCE: ${{ inputs.force }}
        run: python3 tools/release.py pick

  upload:
    name: TestFlight
    needs: pick
    if: needs.pick.outputs.upload == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/testflight.yml
    with:
      # The commit picked above, so a push to the branch during the build cannot slip in
      # untagged. The build number is this run's number; keep re-releases of a version on
      # this workflow so its numbers only ever go up.
      ref: ${{ needs.pick.outputs.sha }}
      build_number: ${{ github.run_number }}
    secrets: inherit

  finish:
    name: Tag, open the pull request and publish the release
    needs: [pick, upload]
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ needs.pick.outputs.branch }}
      VERSION: ${{ needs.pick.outputs.version }}
      SHA: ${{ needs.pick.outputs.sha }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          fetch-depth: 0
          # See the note on RELEASE_TOKEN in release-branch.yml: with it the pull request
          # runs CI; without it the repository must allow Actions to create pull requests.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # Tags the commit that shipped, then opens Release <version> — or, when that pull
      # request is already open, comments the new build number on it — and publishes the
      # tag as a GitHub release: tools/release.py.
      - name: Tag the build, open the pull request, publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: python3 tools/release.py finish
