name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Shared tests and desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # The release scripts in tools/ decide which branch gets cut and what version it
      # carries, so their arithmetic is tested here rather than discovered at 08:00 UTC.
      - name: Release script tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      # No Android SDK on the runner: build the shared module, the desktop target and the sync
      # server (which runs against :shared's JVM build) only.
      - run: ./gradlew :shared:desktopTest :composeApp:desktopTest :server:test -Pgains.android=false --no-daemon
      # The tests run on the JVM, so a JVM-only call in commonMain (putIfAbsent, String.format,
      # java.*) passes them and only fails once Xcode builds the framework. Compiling the iOS
      # klibs catches that here; klib cross-compilation is enabled in gradle.properties.
      - name: Compile the iOS klibs
        run: ./gradlew :shared:compileKotlinIosArm64 :composeApp:compileKotlinIosArm64 -Pgains.android=false --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots
          path: composeApp/build/screenshots
          if-no-files-found: ignore

  # The job above builds with -Pgains.android=false, so nothing there touches androidMain. This
  # one compiles the Android app, lints it and runs the shared tests on the Android JVM
  # (docs/launch-plan.md, item 25): no emulator, no instrumented tests. The SDK is on the
  # ubuntu-latest image, and the Android Gradle Plugin fetches a platform or build-tools version
  # it lacks, as the Google Play workflow does. The sign-in properties stay empty, as in a
  # local build.
  android:
    name: Android build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # :composeApp has no tests of its own; :shared's commonTest runs as its Android unit tests.
      # bundleRelease runs R8 (item 30), unsigned, so a shrinking failure shows on the pull
      # request rather than in the release round's Google Play job.
      - run: ./gradlew :composeApp:assembleDebug :composeApp:lintDebug :shared:testDebugUnitTest :composeApp:bundleRelease --no-daemon --stacktrace
      # On an R8 "Missing class" failure, missing_rules.txt holds the -dontwarn lines it asks for.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: android-reports
          path: |
            composeApp/build/reports/lint-results-debug.*
            composeApp/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore

  # What a pull request adds to the dependencies, checked against GitHub's advisory database
  # before it merges (docs/launch-plan.md, item 28). GitHub can't read the Gradle build, so the
  # job first submits this branch's dependency graph, as dependency-graph.yml does for main, and
  # the review compares the two; it waits for the snapshot it just sent. Submitting needs a
  # token that can write, which a pull request from a fork doesn't get, so those skip it.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          retry-on-snapshot-warnings: true
