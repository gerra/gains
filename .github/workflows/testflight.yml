name: TestFlight

# Archives the iOS app on a macOS runner, signs it with the Apple Distribution certificate
# and App Store provisioning profile kept in the repository secrets, and uploads the build
# to App Store Connect. It appears under TestFlight once Apple has processed it.
#
# The daily Release workflow calls this for the current release branch (workflow_call). A
# push to main no longer uploads anything; a `v*` tag or "Run workflow" still does, by hand.
#
# One-time setup, the secrets this needs and troubleshooting: docs/testflight.md
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or commit to archive. Defaults to the caller's ref."
        required: false
        type: string
      build_number:
        description: "Build number (CFBundleVersion). Defaults to the workflow run number."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion). Defaults to the workflow run number."
        required: false
        type: string
  push:
    tags: ["v*"]

jobs:
  upload:
    name: Archive and upload
    # App Store Connect only accepts apps built with the current major iOS SDK (iOS 26 from
    # Xcode 26 since spring 2026) and rejects the upload otherwise ("SDK version issue").
    # The macOS 15 image still defaults to Xcode 16, so use the image whose default Xcode
    # is current. If Apple moves the bar again, bump this and the images list at
    # https://github.com/actions/runner-images shows which Xcode each image ships.
    runs-on: macos-26
    timeout-minutes: 120
    # Never upload two builds at once: App Store Connect rejects a repeated build number.
    # The group sits on the job so it also holds when the Release workflow calls this one.
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty for tag and manual runs, where the ref that started the run is checked out.
          ref: ${{ inputs.ref }}
      # The runner context is not available in job-level env, so the temp paths are set
      # here. tools/testflight.py holds them, and exports them for the steps below.
      - name: Set paths
        run: python3 tools/testflight.py paths
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Gradle home (wrapper, dependencies and the build cache from gradle.properties).
      # Tag and manual runs are not on the default branch, where this action would only read
      # the cache and never write it, and the CI workflow writes from a Linux runner whose
      # cache a macOS runner cannot use. Write it here so the next upload starts warm.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # The Kotlin/Native compiler, LLVM and Apple sysroots that Gradle downloads into
      # ~/.konan on the first iOS build (over a gigabyte). Keyed on the version catalog, so a
      # Kotlin upgrade fetches a fresh toolchain and everything else reuses the old one.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Check secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: python3 tools/testflight.py check-secrets

      - name: Read app settings
        run: python3 tools/testflight.py settings

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: python3 tools/testflight.py install-signing

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: python3 tools/testflight.py install-api-key

      - name: Archive
        run: python3 tools/testflight.py archive

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: python3 tools/testflight.py upload

      - name: Keep export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-export-${{ env.BUILD_NUMBER }}
          path: ${{ env.EXPORT_PATH }}
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: python3 tools/testflight.py cleanup
