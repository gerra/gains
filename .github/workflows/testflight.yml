name: TestFlight

# Archives the iOS app on a macOS runner, signs it with the Apple Distribution certificate
# and App Store provisioning profile kept in the repository secrets, and uploads the build
# to App Store Connect. It appears under TestFlight once Apple has processed it.
#
# The daily Release workflow calls this for the current release branch (workflow_call). A
# push to main no longer uploads anything; a `v*` tag or "Run workflow" still does, by hand.
#
# One-time setup, the secrets this needs and troubleshooting: docs/testflight.md
on:
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or commit to archive. Defaults to the caller's ref."
        required: false
        type: string
      build_number:
        description: "Build number (CFBundleVersion). Defaults to the workflow run number."
        required: false
        type: string
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (CFBundleVersion). Defaults to the workflow run number."
        required: false
        type: string
  push:
    tags: ["v*"]

jobs:
  upload:
    name: Archive and upload
    # App Store Connect only accepts apps built with the current major iOS SDK (iOS 26 from
    # Xcode 26 since spring 2026) and rejects the upload otherwise ("SDK version issue").
    # The macOS 15 image still defaults to Xcode 16, so use the image whose default Xcode
    # is current. If Apple moves the bar again, bump this and the images list at
    # https://github.com/actions/runner-images shows which Xcode each image ships.
    runs-on: macos-26
    timeout-minutes: 120
    # Never upload two builds at once: App Store Connect rejects a repeated build number.
    # The group sits on the job so it also holds when the Release workflow calls this one.
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty for tag and manual runs, where the ref that started the run is checked out.
          ref: ${{ inputs.ref }}
      # The runner context is not available in job-level env, so the temp paths are set here.
      - name: Set paths
        run: |
          {
            echo "ARCHIVE_PATH=$RUNNER_TEMP/Gains.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/export"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/testflight.keychain-db"
            echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Gradle home (wrapper, dependencies and the build cache from gradle.properties).
      # Tag and manual runs are not on the default branch, where this action would only read
      # the cache and never write it, and the CI workflow writes from a Linux runner whose
      # cache a macOS runner cannot use. Write it here so the next upload starts warm.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # The Kotlin/Native compiler, LLVM and Apple sysroots that Gradle downloads into
      # ~/.konan on the first iOS build (over a gigabyte). Keyed on the version catalog, so a
      # Kotlin upgrade fetches a fresh toolchain and everything else reuses the old one.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Check secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8_BASE64 \
                      IOS_DISTRIBUTION_CERT_P12_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD IOS_APP_STORE_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set (see docs/testflight.md)"; missing=1; fi
          done
          exit $missing

      - name: Read app settings
        run: |
          setting() { grep "^$1=" iosApp/Configuration/Config.xcconfig | cut -d= -f2- | tr -d '[:space:]'; }
          {
            echo "TEAM_ID=$(setting TEAM_ID)"
            echo "BUNDLE_ID=$(setting BUNDLE_ID)"
            echo "MARKETING_VERSION=$(setting MARKETING_VERSION)"
          } >> "$GITHUB_ENV"
          xcodebuild -version
          java -version

      - name: Install signing certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          echo -n "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          # A throwaway keychain holding only the distribution certificate.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Install the App Store profile where Xcode looks for it and remember its name.
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile '$PROFILE_NAME' ($PROFILE_UUID)"
          rm -f "$CERT_PATH"

      - name: Install App Store Connect API key
        env:
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: echo -n "$API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"

      - name: Archive
        run: |
          set -euo pipefail
          echo "Archiving Gains $MARKETING_VERSION ($BUILD_NUMBER) for $BUNDLE_ID with profile '$PROFILE_NAME'"
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Same options as iosApp/ExportOptions.plist, but signed with the installed
          # profile and sent straight to App Store Connect instead of written to disk.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          echo "Uploaded **Gains $MARKETING_VERSION ($BUILD_NUMBER)** to App Store Connect. It shows up under TestFlight once processing finishes." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep export logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-export-${{ env.BUILD_NUMBER }}
          path: ${{ env.EXPORT_PATH }}
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$API_KEY_PATH"
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
