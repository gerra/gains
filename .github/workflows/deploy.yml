name: Deploy server

# Ships the sync server (server/, docs/sync.md) to the Hetzner box the way taxes and www are
# shipped: tests, `installDist`, rsync of the install directory, the systemd unit from the
# repository, restart, smoke test. Runs only for changes that reach the server: the module,
# the shared code it is built from, the unit and this file. UI-only changes leave it alone.
#
# The steps are tools/deploy_server.py, not shell; the same file runs on the box for the
# install itself. Needs the repository secrets DEPLOY_HOST, DEPLOY_USER and DEPLOY_KEY (the
# same three taxes uses), passed through the environment. Secrets for the server itself go
# through `python3 tools/deploy_server.py secrets` from a laptop, never through here.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/src/commonMain/**"
      - "shared/build.gradle.kts"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "deploy/gains-server.service"
      - "tools/deploy_server.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

jobs:
  deploy:
    name: Build and deploy to Hetzner
    runs-on: ubuntu-latest
    environment: default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Test and build the server
        run: ./gradlew :server:test :server:installDist -Pgains.android=false --no-daemon

      - name: Make sure the target directories exist on the box
        run: python3 tools/deploy_server.py prepare

      # The install directory is self-contained: bin/gains-server plus every jar under lib/.
      # `--delete` keeps stale jars from piling up; data and secrets live outside `current/`.
      # The script's own rsync, so no third-party action ever holds DEPLOY_KEY.
      - name: Rsync the build to the box
        run: python3 tools/deploy_server.py build

      - name: Install the unit, restart, smoke test
        id: remote_deploy
        run: python3 tools/deploy_server.py install

      - name: Collect the journal on failure
        if: failure() && steps.remote_deploy.conclusion == 'failure'
        run: python3 tools/deploy_server.py logs --into gains-server-journal.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gains-server-deploy-logs
          path: gains-server-journal.log
          retention-days: 14
          if-no-files-found: ignore
