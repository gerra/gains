name: Cut release branch

# Every two hours through the day, on the even hours from 08:00 to 22:00 UTC, branches
# release/<major>.<minor> off main with the minor version one above the newest release
# branch (or above MARKETING_VERSION on main, whichever is higher) and commits that version
# on the branch. The Release workflow uploads the newest release branch to TestFlight an
# hour later, on the odd hours from 09:00 to 23:00 UTC, and opens its pull request back to
# main.
#
# Nothing is cut when main carries no change that reaches the iOS app, so a quiet stretch
# produces no branch and no build. "Run workflow" cuts by hand, optionally with an explicit
# version (the way to start a new major) or ignoring the no-change check.
#
# How the pieces fit together: docs/testflight.md#releases-through-the-day
on:
  schedule:
    - cron: "0 8-22/2 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the branch (major.minor). Defaults to the next minor."
        required: false
        type: string
      force:
        description: "Cut even if main has not changed since the newest release branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  cut:
    name: Branch off main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The whole history, so the release branches are here to compare against.
          fetch-depth: 0
          # With the optional RELEASE_TOKEN secret (a fine-grained token with contents and
          # pull-requests write access) the push runs CI and the later pull request gets its
          # checks; pushes made with the default token trigger no workflows.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Pick the version
        id: pick
        env:
          REQUESTED: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          current="$(grep '^MARKETING_VERSION=' iosApp/Configuration/Config.xcconfig | cut -d= -f2- | tr -d '[:space:]')"
          major="${current%%.*}"
          minor="${current#*.}"; minor="${minor%%.*}"

          # Every release/<major>.<minor> branch on origin, lowest version first.
          branches="$(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release/' \
            | sed 's#^origin/release/##' | grep -E '^[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n || true)"
          newest="$(printf '%s\n' "$branches" | tail -n1)"

          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
            [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::Version must look like major.minor, got '$version'"; exit 1; }
          else
            # One above the highest minor branched for this major, or above main's if higher.
            top="$(printf '%s\n' "$branches" | awk -F. -v M="$major" '$1 == M { m = $2 } END { print m + 0 }')"
            [ "$minor" -gt "$top" ] && top="$minor"
            version="$major.$((top + 1))"
          fi

          if [ "$version" = "$current" ]; then
            echo "::error::main is already at version $version; pick a higher one"; exit 1
          fi
          if git ls-remote --exit-code --heads origin "release/$version" >/dev/null; then
            echo "::error::Branch release/$version already exists"; exit 1
          fi

          # Skip when nothing that reaches the app changed since the newest release branch.
          # The version line differs by design; docs, samples, the workflows, tests and the
          # Android- and desktop-only sources never make it into the iOS build (the same
          # list the TestFlight workflow used to ignore on pushes to main).
          if [ -n "$newest" ] && [ "$FORCE" != "true" ] \
              && git diff --quiet "origin/release/$newest" origin/main -- . \
                ':(exclude)iosApp/Configuration/Config.xcconfig' \
                ':(exclude)*.md' ':(exclude)docs' ':(exclude)samples' ':(exclude).github' \
                ':(exclude)composeApp/src/androidMain' ':(exclude)composeApp/src/desktopMain' \
                ':(exclude)shared/src/androidMain' ':(exclude)shared/src/desktopMain' \
                ':(exclude)*/src/commonTest/*' ':(exclude)*/src/desktopTest/*'; then
            echo "main has not changed since release/$newest was cut; nothing to release this round." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Next release: $version (main is at $current, newest branch: ${newest:-none})"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the branch
        if: steps.pick.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/$VERSION"
          sed -i "s/^MARKETING_VERSION=.*/MARKETING_VERSION=$VERSION/" iosApp/Configuration/Config.xcconfig
          git add iosApp/Configuration/Config.xcconfig
          git commit -m "Release $VERSION"
          git push -u origin "release/$VERSION"
          echo "Cut **release/$VERSION** from main at $(git rev-parse --short origin/main). The Release workflow uploads it to TestFlight in an hour and then opens the pull request to main." >> "$GITHUB_STEP_SUMMARY"
