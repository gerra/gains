name: Cut release branch

# Every two hours through the day, on the even hours from 08:00 to 22:00 UTC, branches
# release/<major>.<minor> off main with the minor version one above the newest release
# branch (or above MARKETING_VERSION on main, whichever is higher) and commits that version
# on the branch. The Release workflow uploads the newest release branch to TestFlight an
# hour later, on the odd hours from 09:00 to 23:00 UTC, and opens its pull request back to
# main.
#
# Nothing is cut when main carries no change that reaches the iOS app, so a quiet stretch
# produces no branch and no build. "Run workflow" cuts by hand, optionally with an explicit
# version (the way to start a new major) or ignoring the no-change check.
#
# How the pieces fit together: docs/testflight.md#releases-through-the-day
on:
  schedule:
    - cron: "0 8-22/2 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the branch (major.minor). Defaults to the next minor."
        required: false
        type: string
      force:
        description: "Cut even if main has not changed since the newest release branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  cut:
    name: Branch off main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The whole history, so the release branches are here to compare against.
          fetch-depth: 0
          # With the optional RELEASE_TOKEN secret (a fine-grained token with contents and
          # pull-requests write access) the push runs CI and the later pull request gets its
          # checks; pushes made with the default token trigger no workflows.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # Picks the version, stops when main has not changed since the newest branch, and
      # pushes release/<version> with the new MARKETING_VERSION committed on it. The inputs
      # go through the environment, not the command line: tools/release.py reads them there.
      - name: Cut the branch
        env:
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: python3 tools/release.py cut
