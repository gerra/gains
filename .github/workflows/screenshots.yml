name: Screenshots

# Re-renders the README screenshots by driving the desktop app headlessly
# (composeApp/src/desktopTest/kotlin/app/gains/ScreenshotTest.kt) and commits
# the result to the branch the workflow ran on. The same run records clips of the
# app's motion frame by frame and encodes them into docs/animations as GIFs and MP4s,
# and turns six of the screenshots into the site's pictures in site/img.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Render screenshots
        run: ./gradlew :composeApp:desktopTest --tests 'app.gains.ScreenshotTest' -Pgains.android=false -Pgains.screenshotDir=docs/screenshots -Pgains.animationDir=docs/animations --no-daemon
      - name: Encode animations
        if: always()
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          mkdir -p docs/animations
          cd docs/animations
          shopt -s nullglob
          for dir in frames/*/; do
            name=$(basename "$dir")
            # Frames were saved every 32 ms of app time: 31.25 a second.
            ffmpeg -loglevel error -y -framerate 31.25 -i "$dir/%04d.png" \
              -vf "scale=360:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
              -loop 0 "$name.gif"
            ffmpeg -loglevel error -y -framerate 31.25 -i "$dir/%04d.png" \
              -vf "scale=720:-2:flags=lanczos" -c:v libx264 -pix_fmt yuv420p -crf 23 -movflags +faststart "$name.mp4"
            echo "$name: $(ls "$dir" | wc -l) frames"
          done
          rm -rf frames
      # The site's pictures are these same renders of the sample export, plain and unframed, so the
      # site never shows anyone's real training (docs/launch-plan.md, item 39). site/index.html names
      # them and gives their size, 600 × 1075.
      - name: Site images
        run: |
          command -v cwebp >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q webp; }
          for pair in 05-lifts:hero 03-home:shot-home 14-program-day:shot-workout 07-volume:shot-volume 17-summary:shot-summary 12-programs:shot-programs; do
            cwebp -quiet -q 82 -resize 600 0 "docs/screenshots/${pair%%:*}.png" -o "site/img/${pair##*:}.webp"
          done
      - name: Show test report on failure
        if: failure()
        run: |
          for f in composeApp/build/test-results/desktopTest/*.xml; do echo "== $f"; head -c 20000 "$f" || true; done; true
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/screenshots docs/animations
          # Raw frames are only ever an intermediate, even when encoding them failed.
          rm -rf docs/animations/frames
          git add -A docs/screenshots docs/animations site/img
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "Regenerate screenshots, animations and site images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
