name: Screenshots

# Re-renders the README screenshots by driving the desktop app headlessly
# (composeApp/src/desktopTest/kotlin/app/gains/ScreenshotTest.kt) and commits
# the result to the branch the workflow ran on. The same run records clips of the
# app's motion frame by frame and encodes them into docs/animations as GIFs and MP4s,
# and turns six of the screenshots into App Store screenshots in docs/store and the site's
# pictures in site/img (tools/store_screenshots.py).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Render screenshots
        run: ./gradlew :composeApp:desktopTest --tests 'app.gains.ScreenshotTest' -Pgains.android=false -Pgains.screenshotDir=docs/screenshots -Pgains.animationDir=docs/animations --no-daemon
      - name: Encode animations
        if: always()
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          mkdir -p docs/animations
          cd docs/animations
          shopt -s nullglob
          for dir in frames/*/; do
            name=$(basename "$dir")
            # Frames were saved every 32 ms of app time: 31.25 a second.
            ffmpeg -loglevel error -y -framerate 31.25 -i "$dir/%04d.png" \
              -vf "scale=360:-1:flags=lanczos,split[a][b];[a]palettegen=stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
              -loop 0 "$name.gif"
            ffmpeg -loglevel error -y -framerate 31.25 -i "$dir/%04d.png" \
              -vf "scale=720:-2:flags=lanczos" -c:v libx264 -pix_fmt yuv420p -crf 23 -movflags +faststart "$name.mp4"
            echo "$name: $(ls "$dir" | wc -l) frames"
          done
          rm -rf frames
      # The App Store screenshots and the site's pictures are these same renders of the sample export,
      # in a phone and under a headline drawn by the script, so neither ever shows anyone's real
      # training (docs/launch-plan.md, item 39). site/index.html names them and gives their sizes.
      - name: Store screenshots and site images
        run: |
          python3 -c 'import PIL' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q python3-pil; }
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || { sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core; }
          python3 tools/store_screenshots.py
      - name: Show test report on failure
        if: failure()
        run: |
          for f in composeApp/build/test-results/desktopTest/*.xml; do echo "== $f"; head -c 20000 "$f" || true; done; true
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/screenshots docs/animations docs/store
          # Raw frames are only ever an intermediate, even when encoding them failed.
          rm -rf docs/animations/frames
          git add -A docs/screenshots docs/animations docs/store site/img
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "Regenerate screenshots, animations and site images"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
