name: CodeQL

# Code scanning of the Kotlin (docs/launch-plan.md, item 28); findings show under Security →
# Code scanning, and on a pull request as annotations. A workflow rather than GitHub's default
# setup: the default setup's autobuild can't be told which tasks to run, and a Kotlin
# Multiplatform build has no plain `build` that compiles on Linux without the iOS link. So this
# compiles what runs on a JVM, the Android and JVM targets of the three KMP modules and the server,
# with every task rerun and nothing from the build cache: CodeQL sees Kotlin only when kotlinc
# actually runs, and only when it runs in Gradle's process rather than the Kotlin daemon.
# CodeQL's Kotlin extractor trails Kotlin releases: when a Kotlin bump fails here, check its
# supported versions before anything else.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that touches nothing Gradle reads (tools/changes.py: docs, the site, tools/,
  # deploy/) has no Kotlin to scan, so the analysis skips itself; see ci.yml's job of the same
  # name. The push to main and the weekly run always analyze.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: changes
        run: python3 tools/changes.py

  analyze:
    name: Analyze the Kotlin
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Compile the JVM and Android code
        run: >-
          ./gradlew
          :protocol:compileKotlinJvm :protocol:compileAndroidMain
          :shared:compileKotlinDesktop :shared:compileAndroidMain
          :composeApp:compileKotlinDesktop :composeApp:compileAndroidMain
          :server:compileKotlin
          -Pkotlin.compiler.execution.strategy=in-process
          --no-daemon --no-build-cache --rerun-tasks
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:java-kotlin
