// Android target of :composeApp (applied only when gains.android=true), on the Kotlin
// Multiplatform library plugin. AGP 9 no longer takes com.android.application next to the Kotlin
// Multiplatform plugin, so the application is :androidApp, a thin module holding only what must
// belong to one: the application id, the version, signing, the build types, R8 (docs/launch-plan.md,
// item 38). The Kotlin, the manifest and the resources stay here: the Android code uses this
// module's internal declarations, and the actuals in platform/ must stay with their expects.
// Groovy, so the Kotlin DSL build file never names an AGP type, and applied before the kotlin { }
// block there, which only exists once this creates the target.
kotlin {
    android {
        // The manifest's relative names (.MainActivity, .GainsApplication) resolve against this,
        // and so does R: app.gains.R. The application's namespace is a different one.
        namespace = "app.gains"
        compileSdk = libs.versions.android.compileSdk.get().toInteger()
        minSdk = libs.versions.android.minSdk.get().toInteger()
        // Off by default in the library plugin. The notification strings, the drawables, the
        // layout and the sign-in config use R, and the Compose resources ship as Android assets.
        androidResources {
            enable = true
        }
    }
}
