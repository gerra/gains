// Android application configuration for :composeApp (applied only when gains.android=true).
android {
    namespace "app.gains"
    compileSdk libs.versions.android.compileSdk.get().toInteger()

    defaultConfig {
        // Public on Google Play, and Play never lets it change after the first upload
        // (docs/launch-plan.md, item 8). Kept as "app.gains" on purpose.
        applicationId "app.gains"
        minSdk libs.versions.android.minSdk.get().toInteger()
        targetSdk libs.versions.android.targetSdk.get().toInteger()
        versionCode 1
        versionName "1.0"
        // The sync server and the Google Web application client (docs/development.md, "Android"),
        // from the Gradle properties so they change without touching code, like the desktop's
        // system properties. Empty leaves the app a guest with Google's button hidden.
        buildConfigField "String", "SERVER_URL", "\"${project.findProperty('gains.serverUrl') ?: ''}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${project.findProperty('gains.googleWebClientId') ?: ''}\""
    }
    buildFeatures {
        // AGP no longer generates BuildConfig unless asked; androidAuthConfig() reads the two fields above.
        buildConfig true
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
